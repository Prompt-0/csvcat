[package]
name = "csvcat"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity AI <agy@deepmind.com>"]
description = "Modern Terminal CSV/TSV Table Viewer, Data Profiler, and Interactive TUI"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
csv = "1.3"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
terminal_size = "0.3"
crossterm = "0.27"
ratatui = "0.26"
comfy-table = { version = "7.1", features = ["custom_styling"] }
colored = "2.1"
anyhow = "1.0"
chrono = "0.4"
